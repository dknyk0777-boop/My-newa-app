const letters=["(A)","(B)","(C)","(D)"];
const root=document.getElementById("quiz");
questions.forEach((q,i)=>{
 const card=document.createElement("section"); card.className="question";
 const opts=q[1].map((o,j)=>`<div class="option"><strong>${letters[j]}</strong> ${o}</div>`).join("");
 card.innerHTML=`<div class="qhead">प्रश्न ${i+1}. ${q[0]}</div><div class="options">${opts}</div><div class="actions"><button class="toggle" type="button">उत्तर दिखाएँ</button></div><div class="answer">सही उत्तर: ${letters[q[2]]} ${q[1][q[2]]}</div>`;
 const btn=card.querySelector("button"), ans=card.querySelector(".answer");
 btn.addEventListener("click",()=>{const open=ans.style.display==="block";ans.style.display=open?"none":"block";btn.textContent=open?"उत्तर दिखाएँ":"उत्तर छिपाएँ";});
 root.appendChild(card);
});
function setAll(show){document.querySelectorAll(".answer").forEach(a=>a.style.display=show?"block":"none");document.querySelectorAll(".toggle").forEach(b=>b.textContent=show?"उत्तर छिपाएँ":"उत्तर दिखाएँ");}
